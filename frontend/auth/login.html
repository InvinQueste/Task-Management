<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/frontend/auth/styles.css" />
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-left">
        <img src="/frontend/assets/illustration.jpg" alt="Study Illustration" />
        <h2>Your Task Buddy</h2>
        <p>Keep a track of your daily life and manage tasks efficienty</p>
      </div>

      <div class="auth-right">
        <h1 class="brand">TASK <span>BUDDY</span></h1>
        <form id="loginForm">
          <input type="text" name="username" placeholder="Username or Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Login</button>
          <p class="auth-link">
            Don't have an account? <a href="/register">Register</a>
          </p>
        </form>
        <br />
        <div id="message"></div>
      </div>
    </div>
    <script src="/frontend/auth/login.js"></script>
  </body>
</html>
