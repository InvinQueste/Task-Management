<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/Task-Management/" />
    <meta charset="UTF-8" />
    <title>Register</title>
    <link rel="stylesheet" href="/Task-Management/frontend/auth/styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-left">
        <img src="/Task-Management/frontend/assets/illustration.jpg" alt="Study Illustration" />
        <h2>Your Task Buddy</h2>
        <p>Unlock your potential by creating your account</p>
      </div>

      <div class="auth-right">
        <h1 class="brand">CREATE <span>ACCOUNT</span></h1>
        <form id="registerForm">
          <input type="text" name="username" placeholder="Username" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Register</button>
          <p class="auth-link">
            Already have an account? <a href="/Task-Management/login">Login</a>
          </p>
        </form>
        <br />
        <div id="message"></div>
      </div>
    </div>
    <script src="/Task-Management/frontend/auth/register.js"></script>
  </body>
</html>
